[package]
name = "mtlp"
version = "0.1.0"
description = "MTLP: My Tiny Local Planner"
authors = ["MTLP contributors"]
edition = "2021"

[lib]
name = "mtlp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
